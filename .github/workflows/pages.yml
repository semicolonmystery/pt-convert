name: Pages

# Build the Next.js static export and publish it with GitHub Pages at
# https://pt-convert.podik.cz/ .
#
# Repository setup (once): Settings > Pages > Source: "GitHub Actions", and the
# custom domain pt-convert.podik.cz. With Actions-based Pages the domain set
# in the settings is the one that counts, so no CNAME file is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the minimum: read the code, deploy to Pages with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # Writes out/: the page, 404.html, opengraph image, sitemap.xml, robots.txt, icon.
      - name: Build the site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
